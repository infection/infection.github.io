name: Deploy site to GitHub Pages

on:
  # Repo default branch is `master` -- switch this if you keep pushing there
  push:
    branches: [main]
  # Allows a manual run from the Actions tab
  workflow_dispatch:

permissions: {}

# Allow one deploy at a time, and never cancel one mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # No fetch-depth: 0 -- `lastUpdated` is not enabled in config.mts
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Cache VitePress
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('package-lock.json', 'posts/**', 'guide/**', 'menu/**', '.vitepress/**') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Verify legacy URLs and anchors
        run: npm run check:urls

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .vitepress/dist

  deploy:
    name: Deploy
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
